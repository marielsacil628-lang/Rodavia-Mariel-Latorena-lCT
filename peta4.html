<!DOCTYPE html>
<html>
<head>
    <title>Reservation Form</title>
</head>

<body bgcolor="pink">

<center>
    <h1><font color="white">TOURIST DESTINATION RESERVATION</font></h1>

    <form action="peta3.html" method="get">

    <table bgcolor="white" cellpadding="10">

        <tr>
            <td>Full Name:</td>
            <td><input type="text" name="fullname" required></td>
        </tr>

        <tr>
            <td>Email:</td>
            <td><input type="email" name="email" required></td>
        </tr>

        <tr>
            <td>Phone Number:</td>
            <td><input type="tel" name="phone" required></td>
        </tr>

        <tr>
            <td>Destination:</td>
            <td>
                <select name="destination">
                    <option>Banaue Rice Terraces</option>
                    <option>Mayon Volcano</option>
                    <option>Intramuros</option>
                    <option>Taal Volcano</option>
                    <option>Sagada</option>
                    <option>Chocolate Hills</option>
                    <option>Fort San Pedro</option>
                    <option>Kawasan Falls</option>
                    <option>Siquijor Island</option>
                    <option>Boracay Island</option>
                    <option>Lake Sebu</option>
                    <option>Siargao Island</option>
                    <option>Divine Mercy Shrine</option>
                    <option>Maria Cristina Falls</option>
                    <option>Samal Island</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>Number of Guests:</td>
            <td><input type="number" min="1" max="20"></td>
        </tr>

        <tr>
            <td>Check-in Date:</td>
            <td><input type="date"></td>
        </tr>

        <tr>
            <td>Check-out Date:</td>
            <td><input type="date"></td>
        </tr>

        <tr>
            <td>Comments:</td>
            <td><textarea rows="4" cols="25"></textarea></td>
        </tr>

        <tr>
            <td colspan="2" align="center">
                <a href="peta3.html"><input type="submit" value="Reserve"></a>
                <input type="reset" value="Clear">
            </td>
        </tr>

    </table>

    </form>

</center>

</body>
</html>
